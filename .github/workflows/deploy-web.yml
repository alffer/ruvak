name: Desplegar web (Cloudflare Workers)

# Cada push a main publica la web. Se salta si no existe la variable CLOUDFLARE_WORKER_NAME.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: vars.CLOUDFLARE_WORKER_NAME != ''
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_BUILD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compilar la web
        run: npx expo export --platform web --output-dir dist

      - name: Configurar el Worker (activos estáticos, rutas a index.html)
        env:
          WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        run: |
          # Wrangler 4 exige un punto de entrada. Los archivos los sirve Cloudflare; este Worker solo cumple el requisito.
          cat > worker.js <<'JS'
          export default { fetch: () => new Response("Not found", { status: 404 }) };
          JS
          cat > wrangler.jsonc <<JSON
          {
            "name": "${WORKER_NAME}",
            "main": "worker.js",
            "compatibility_date": "2026-11-01",
            "assets": {
              "directory": "./dist",
              "not_found_handling": "single-page-application"
            }
          }
          JSON

      - name: Desplegar
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
